  # Pinned by digest for reproducible runs (PostgreSQL 17.12).
  image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
  isolation:
    memory_mb: 1024
    cpus: 2
fixture:
  schema: ./fixtures/schema.sql
  seed_sql: ./fixtures/seed.sql
workload:
