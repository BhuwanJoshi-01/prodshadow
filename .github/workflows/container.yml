name: Container image

# Publishes ghcr.io/bhuwanjoshi-01/prodshadow when a release is published:
# the release's static Linux binaries (checked against SHA256SUMS) on a
# distroless base, for linux/amd64 and linux/arm64, with an SBOM and
# provenance. Tags: X.Y.Z, X.Y and, for stable releases, latest.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: container-${{ github.event.release.tag_name || inputs.tag }}

env:
  IMAGE: ghcr.io/bhuwanjoshi-01/prodshadow

jobs:
  image:
    name: Build and push the image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Download the Linux archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern 'prodshadow_*_linux_*.tar.gz' --pattern SHA256SUMS
          (cd dist && sha256sum --check --ignore-missing SHA256SUMS)
      - name: Build context
        run: packaging/docker/context.sh dist build/docker
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
          labels: |
            org.opencontainers.image.title=prodshadow
            org.opencontainers.image.description=Rehearse PostgreSQL migrations under load in a disposable database
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.documentation=https://bhuwanjoshi-01.github.io/prodshadow/
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: build/docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Run the published image
        run: docker run --rm "${IMAGE}:${TAG#v}" version | grep -F "prodshadow ${TAG} "
