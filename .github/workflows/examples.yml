name: Examples

# Runs every example end to end and checks the documented decision. This is
# the "one true positive and one non-alarm example" acceptance check.
# Each example runs a full experiment (about two minutes each), so the suite
# runs weekly and on demand rather than on every change.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Run examples
        run: go test -tags integration -count=1 -timeout 55m -v -run TestExamples ./tests/integration/
      - name: Upload example reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-reports
          path: tests/integration/testdata/out
          if-no-files-found: ignore
