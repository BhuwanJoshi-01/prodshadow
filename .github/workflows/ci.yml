name: CI

# Pull requests are merged by fast-forward, so the commit tested here is the
# exact commit that lands on main; a second run on push would only repeat
# it. A nightly run covers main itself. Documentation-only changes skip the
# build entirely.
on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", "NOTICE"]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # One job instead of several: each job pays for runner start-up, checkout
  # and the cgo build of the SQL parser, and minutes are rounded up per job.
  check:
    name: lint, tidy and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal schemas tests)" || (gofmt -l cmd internal schemas tests && exit 1)
      - name: go mod tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Unit tests
        run: go test -race -count=1 ./...
      - name: Build
        run: go build -trimpath -o bin/prodshadow ./cmd/prodshadow && ./bin/prodshadow version

  # macOS minutes are billed at ten times the Linux rate on private
  # repositories; platform differences are rare, so check nightly.
  macos:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test -count=1 ./...
      - name: Build
        run: go build -trimpath -o bin/prodshadow ./cmd/prodshadow && ./bin/prodshadow version

  fuzz:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Fuzz the statement splitter
        run: go test -run XXX -fuzz FuzzSplit -fuzztime 30s ./internal/sqlsplit/
      - name: Fuzz workload drafts from exported statistics
        run: go test -run XXX -fuzz FuzzDraftFromStats -fuzztime 30s ./internal/workload/
      - name: Fuzz static analysis
        run: go test -run XXX -fuzz 'FuzzAnalyze$' -fuzztime 30s ./internal/sqlinspect/
      - name: Fuzz schema catalog resolution
        run: go test -run XXX -fuzz FuzzCatalogResolve -fuzztime 30s ./internal/sqlinspect/
