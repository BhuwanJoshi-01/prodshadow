name: Wrong or missing finding
description: A finding was wrong, overstated, or a real problem was not detected.
labels: [area:reports, needs-design]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - False positive (a finding that should not be there)
        - False negative (a real problem was missed)
        - Overstated confidence or wording
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: PS101, OBS002, ...
  - type: textarea
    id: migration
    attributes:
      label: Migration SQL
      render: sql
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Fixture, workload and PostgreSQL version
      description: Enough to reproduce. Attach the JSON report if you can (it contains no SQL text by default).
    validations:
      required: true
  - type: textarea
    id: production
    attributes:
      label: What happened in production (if anything)?
