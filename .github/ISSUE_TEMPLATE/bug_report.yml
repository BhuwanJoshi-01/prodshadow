name: Bug report
description: ProdShadow crashed, failed to clean up, or behaved unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems (SQL reaching a database ProdShadow did not create, secrets in reports, container escapes) must be reported privately — see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command you ran and its output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version and environment
      description: Output of `prodshadow version --json` and `prodshadow doctor`.
      render: text
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal configuration, migration and workload. Remove anything sensitive.
